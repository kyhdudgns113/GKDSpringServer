spring.application.name=GKDSpringServer
spring.config.import=optional:classpath:secret.properties

spring.datasource.url=jdbc:mysql://localhost:3306/GKDSpring?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:GKDSpringLocalJwtSecretKey_MustBeAtLeast32Chars}
jwt.expire-ms=${JWT_EXPIRE_MS:604800000}
